<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>days · 在一起</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fce8ec;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 1.5rem;
        }

        .container {
            text-align: center;
            background: rgba(255, 245, 247, 0.6);
            backdrop-filter: blur(4px);
            padding: 2.5rem 2rem;
            border-radius: 40px;
            box-shadow: 0 8px 24px rgba(200, 120, 140, 0.12);
            border: 1px solid rgba(255, 220, 225, 0.5);
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #a06b78;
            margin-bottom: 1rem;
        }

        .timer {
            font-size: clamp(2.6rem, 10vw, 5.6rem);
            font-weight: 300;
            color: #5a3e44;
            letter-spacing: 2px;
            margin: 0.5rem 0 0.2rem;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #bb8a94;
            margin-top: 0.5rem;
        }

        .separator {
            width: 30px;
            height: 1px;
            background: #e6c8cd;
            margin: 1.2rem auto 1.5rem;
        }

        .footer-note {
            font-size: 0.65rem;
            color: #c9a4ac;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">✦ 在一起总计 ✦</div>
        <div class="timer" id="timer">00:00:00:00</div>
        <div class="label">days · since 2026.08.10</div>
        <div class="separator"></div>
        <div class="footer-note">——</div>
    </div>

    <script>
        const startDate = new Date('2026-08-10T15:00:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.getElementById('timer').textContent = '00:00:00:00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timer').textContent =
                `${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
